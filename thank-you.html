
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | MIND & MARGIN</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .thank-you-section {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            background: #FCF8F1;
        }

        .thank-you-content {
            max-width: 600px;
            padding: 40px 25px;
        }

        .thank-you-icon {
            font-size: 60px;
            color: #713849;
            margin-bottom: 20px;
        }

        .thank-you-content h1 {
            color: #713849;
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin-bottom: 20px;
        }

        .thank-you-content p {
            color: #49383A;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        
        
        
        .chat-cta {
            text-align: center;
            margin-top: 22px;
        }

        .chat-cta .chat-button {
            display: inline-block;
            width: auto;
            margin-top: 0;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            background: #713849;
            color: white;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }

        .chat-cta .chat-button:hover {
            background: #A77B82;
        }

        .chat-description {
            max-width: 490px;
            margin: 9px auto 0;
            color: #49383A;
            font-size: 2px;
            line-height: 1.5;
        }


        @media (max-width: 600px) {
            .thank-you-content h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <section class="thank-you-section">
        <div class="thank-you-content">

            <div class="thank-you-icon">✓</div>

            <h1>Thank You for Your Purchase!</h1>

            <p>
                Thank you for choosing MIND & MARGIN.
                We appreciate your support!
            </p>

            <p>
                Follow the next step to receive your digital product.
            </p>
             
            
       <div class="chat-cta">
            <a href="chat.html" class="chat-button">
            Open Verification Chat
            </a>

        <p class="chat-description">
            Submit your order details to receive your product.
        </p>
        </div>

            

        </div>
    </section>

</body>
</html>
