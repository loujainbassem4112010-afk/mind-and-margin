
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | MIND & MARGIN</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .thank-you-section {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            background: #FCF8F1;
        }

        .thank-you-content {
            max-width: 600px;
            padding: 40px 25px;
        }

        .thank-you-icon {
            font-size: 60px;
            color: #713849;
            margin-bottom: 20px;
        }

        .thank-you-content h1 {
            color: #713849;
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin-bottom: 20px;
        }

        .thank-you-content p {
            color: #49383A;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .thank-you-button {
            display: inline-block;
            background: #713849;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 5px;
            transition: opacity 0.3s;
        }

        .thank-you-button:hover {
            opacity: 0.85;
        }

        @media (max-width: 600px) {
            .thank-you-content h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <section class="thank-you-section">
        <div class="thank-you-content">

            <div class="thank-you-icon">✓</div>

            <h1>Thank You for Your Purchase!</h1>

            <p>
                Thank you for choosing MIND & MARGIN.
                We appreciate your support!
            </p>

            <p>
                Your digital product delivery instructions
                will be provided here.
            </p>

            <a href="index.html" class="thank-you-button">
                Back to Store
            </a>

        </div>
    </section>

</body>
</html>
